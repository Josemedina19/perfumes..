<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto - Tienda de Perfumes</title>
    <link rel="stylesheet" href="contacto.css" />
</head>

<body>
    <header>
        <div class="logo">
            <h1>Tienda de Perfumes</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html#productos">Productos</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="contacto-title" role="form">
            <h2 id="contacto-title">Contáctenos por Correo</h2>

            <form action="https://formspree.io/f/xyznzekd" method="POST" novalidate>
                <div class="form-group">
                    <input type="text" id="nombre" name="nombre" placeholder=" " required autocomplete="name" />
                    <label for="nombre">Nombre completo</label>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder=" " required autocomplete="email" />
                    <label for="email">Correo electrónico</label>
                </div>

                <div class="form-group">
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder=" " required></textarea>
                    <label for="mensaje">Mensaje</label>
                </div>

                <button type="submit" aria-label="Enviar mensaje">Enviar</button>
            </form>

            <div class="contact-info" aria-label="Información alternativa de contacto">
                <p>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="24" height="24">
                        <path
                            d="M20.5 3.5a16 16 0 0 0-17 17c.6 2.2 2.4 4 4.6 4.6l1.7-5.4a1 1 0 0 0-.3-1.1l-2.1-2.1a12 12 0 0 1 7.6-7.6l2.1 2.1a1 1 0 0 0 1.1-.3l1.7-5.4zM14.8 16a.5.5 0 0 1-.5.4 9 9 0 0 1-5.4-2.3.5.5 0 0 1 0-.7l1.3-1.3a.5.5 0 0 1 .7 0 6 6 0 0 0 2.8 1.7.5.5 0 0 1 .4.5z" />
                    </svg> También puedes llamarnos o escribirnos:
                </p>

                <div class="contact-buttons">
                    <a href="https://wa.me/51991251667" target="_blank" rel="noopener noreferrer" class="whatsapp-button">
                        📱 WhatsApp
                    </a>
                    <a href="tel:+51991251667" class="call-button">
                        📞 Llamar
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer>
